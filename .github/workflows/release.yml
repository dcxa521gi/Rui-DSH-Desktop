name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --win --x64
            paths: |
              dist/*.exe
              dist/*.blockmap
              dist/*.zip
              dist/*.yml
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/*.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Smoke
        run: npm run smoke
      - name: Build
        run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Unofficial desktop shell for DeepSeek Harness.

            Embedded engine: `@deepseek-ai/dsh@0.1.1-rc.2`

            Windows installers may trigger SmartScreen (unsigned).
            macOS builds are unsigned; right-click Open the first time.
          files: artifacts/**
